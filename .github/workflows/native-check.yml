name: Native macOS checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['native/Sources/**', 'native/Resources/**', 'native/Icon/**', 'native/Tests/**', 'native/scripts/**', 'package.json', 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md', 'README.md', '.github/workflows/native-check.yml', '.github/workflows/release.yml']
concurrency:
  group: native-check-v2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Locate native source
        id: location
        shell: bash
        run: |
          if [[ -f native/scripts/build.sh ]]; then echo 'dir=native' >> "$GITHUB_OUTPUT"; else echo 'dir=.' >> "$GITHUB_OUTPUT"; fi
      - name: Core and protocol regression checks
        working-directory: ${{ steps.location.outputs.dir }}
        run: bash scripts/test.sh
      - name: Build both Mac architectures
        id: build
        working-directory: ${{ steps.location.outputs.dir }}
        env:
          WLSAPLUS_REQUIRE_ICON_VARIANTS: '1'
        run: bash scripts/build.sh
      - name: App icon in the built bundle
        working-directory: ${{ steps.location.outputs.dir }}
        run: |
          set -euo pipefail
          resources=out/WLSAPlus.app/Contents/Resources
          plist=out/WLSAPlus.app/Contents/Info.plist
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")" == AppIcon ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$plist")" == AppIcon ]]
          /usr/bin/iconutil --convert iconset --output "$RUNNER_TEMP/AppIcon.iconset" "$resources/AppIcon.icns"
          ls "$RUNNER_TEMP/AppIcon.iconset"
          test -s "$resources/Assets.car"
          xcrun assetutil --info "$resources/Assets.car" > "$RUNNER_TEMP/icon-assets.json"
          grep -q '"AppIcon"' "$RUNNER_TEMP/icon-assets.json"
          grep -Eo '"(Appearance|Name|AssetType)" *: *"[^"]*"' "$RUNNER_TEMP/icon-assets.json" | sort | uniq -c || true
      - name: Startup health check
        working-directory: ${{ steps.location.outputs.dir }}
        run: |
          mkdir -p "$HOME/Library/Application Support/WLSAPlus/updates/staging/2.0.0-beta.1"
          marker="$HOME/Library/Application Support/WLSAPlus/updates/staging/2.0.0-beta.1/launched.marker"
          python3 - "$marker" <<'PY'
          import subprocess,sys
          subprocess.run(['open','-W','out/WLSAPlus.app','--args','--wlsaplus-update-marker='+sys.argv[1],'--wlsaplus-update-verify-only'],check=True,timeout=90)
          PY
          test -f "$marker"
      - name: Signed legacy updater compatibility
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ steps.location.outputs.dir }}
        env:
          WLSAPLUS_RUN_SIGNED_COMPAT_SMOKE: '1'
          WLSAPLUS_NATIVE_UPDATE_LAUNCH_SMOKE: '1'
          WLSAPLUS_CODESIGN_P12_BASE64: ${{ secrets.WLSAPLUS_CODESIGN_P12_BASE64 }}
          WLSAPLUS_CODESIGN_P12_PASSWORD: ${{ secrets.WLSAPLUS_CODESIGN_P12_PASSWORD }}
          WLSAPLUS_UPDATE_ED25519_KEY: ${{ secrets.WLSAPLUS_UPDATE_ED25519_KEY }}
        run: bash scripts/signed-update-compat.sh
      - name: Native VPN and network restoration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ steps.location.outputs.dir }}
        env:
          # Clash HTTPS subscription for live smoke only (same secret as release suggestion).
          WLSAPLUS_DEFAULT_SUBSCRIPTION_URL: ${{ secrets.WLSAPLUS_DEFAULT_SUBSCRIPTION_URL }}
        run: bash scripts/vpn-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WLSAPlus-native-review
          path: |
            out/WLSAPlus-native-review.zip
            native/out/WLSAPlus-native-review.zip
          if-no-files-found: warn
