name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.0)
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Resolve and validate version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            publish=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="$(node -p "require('./package.json').version")"
            publish=false
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Invalid version '$version'. Use a semantic version such as 1.2.0 or 1.2.0-beta.1." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building WLSAPlus $version (publish: $publish)"

  macos:
    needs: prepare
    runs-on: macos-latest
    env:
      WLSAPLUS_VERSION: ${{ needs.prepare.outputs.version }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run version:apply
      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$RUNNER_TEMP/build.keychain"
      # electron:make = electron-forge make --platform darwin --arch universal (Intel x64 + Apple arm64)
      - run: npm run electron:make
      - name: Verify universal arch
        run: |
          set -euo pipefail
          app_path="$(find out -type d -path '*darwin-universal*' -name 'WLSAPlus.app' -prune | head -n 1)"
          test -n "$app_path"
          archs="$(lipo -archs "$app_path/Contents/MacOS/WLSAPlus")"
          echo "Architectures: $archs"
          echo "$archs" | grep -qw x86_64 || { echo "missing x86_64 slice (not universal)" >&2; exit 1; }
          echo "$archs" | grep -qw arm64 || { echo "missing arm64 slice (not universal)" >&2; exit 1; }
      - name: Stage macOS packages
        run: |
          mkdir -p release-assets
          dmg_path="$(find out/make -type f -name '*.dmg' | head -n 1)"
          zip_path="$(find out/make -type f -name '*.zip' | head -n 1)"
          test -n "$dmg_path" && cp "$dmg_path" "release-assets/WLSAPlus-${WLSAPLUS_VERSION}-macOS-universal.dmg"
          test -n "$zip_path" && cp "$zip_path" "release-assets/WLSAPlus-${WLSAPLUS_VERSION}-macOS-universal.zip"
          test -n "$dmg_path$zip_path"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release-assets/*

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: WLSAPlus ${{ needs.prepare.outputs.version }} (macOS Universal · Intel & Apple)
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
