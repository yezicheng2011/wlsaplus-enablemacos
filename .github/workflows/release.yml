name: Build and release native macOS app
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, for example 2.0.0-beta.1
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      beta: ${{ steps.version.outputs.beta }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and locate source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then version="${REQUESTED_VERSION#v}"; else version="${GITHUB_REF_NAME#v}"; fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*)?$ ]] || exit 1
          beta=false
          [[ "$version" != *-* ]] || beta=true
          if [[ -f native/scripts/release.sh ]]; then source=native; else source=.; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"
          echo "WLSAPLUS_VERSION=$version" >> "$GITHUB_ENV"
          echo "NATIVE_SOURCE=$source" >> "$GITHUB_ENV"
      - name: Import the existing signing certificate
        env:
          WLSAPLUS_CODESIGN_P12_BASE64: ${{ secrets.WLSAPLUS_CODESIGN_P12_BASE64 }}
          WLSAPLUS_CODESIGN_P12_PASSWORD: ${{ secrets.WLSAPLUS_CODESIGN_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${WLSAPLUS_CODESIGN_P12_BASE64:?Existing certificate is required}"
          : "${WLSAPLUS_CODESIGN_P12_PASSWORD:?Existing certificate password is required}"
          umask 077
          cert="$RUNNER_TEMP/native-signing.p12"
          certificate="$RUNNER_TEMP/native-signing.cer"
          keychain="$RUNNER_TEMP/native-signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$WLSAPLUS_CODESIGN_P12_BASE64" | base64 -D > "$cert"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security import "$cert" -k "$keychain" -P "$WLSAPLUS_CODESIGN_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-certificate -c 'WLSAPlus Self-Signed Code Signing' -p "$keychain" > "$certificate"
          node - "$certificate" <<'JS'
          const fs = require('node:fs'), {X509Certificate} = require('node:crypto');
          const cert = new X509Certificate(fs.readFileSync(process.argv[2]));
          if (cert.fingerprint.replace(/:/g, '').toUpperCase() !== '764D4389AAFA0C50311E39C17DDFA1981ABEF86C') throw Error('Unexpected signing certificate');
          JS
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$certificate"
          rm -f "$cert"
      - name: Test, build and prepare compatible signed packages
        env:
          WLSAPLUS_UPDATE_ED25519_KEY: ${{ secrets.WLSAPLUS_UPDATE_ED25519_KEY }}
        run: bash "$NATIVE_SOURCE/scripts/release.sh"
      - name: Stage flat release assets
        run: |
          mkdir -p "$RUNNER_TEMP/native-release-assets"
          cp "$NATIVE_SOURCE/release-assets/"* "$RUNNER_TEMP/native-release-assets/"
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-assets
          path: ${{ runner.temp }}/native-release-assets/*
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/native-signing.cer" ]]; then
            sudo -n security remove-trusted-cert -d "$RUNNER_TEMP/native-signing.cer" || true
          fi
          security delete-keychain "$RUNNER_TEMP/native-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/native-signing.p12" "$RUNNER_TEMP/native-signing.cer"
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      BETA: ${{ needs.build.outputs.beta }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-release-assets
          path: artifacts
      - name: Publish test build or prepare stable draft
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'This version already has a release; use a new version.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import os,pathlib
          pathlib.Path('release-notes.txt').write_text('WLSAPlus '+os.environ['VERSION']+' for macOS 13+, Intel and Apple silicon.\n\nNative system-framework implementation. Includes per-architecture update packages, universal download and signed update-manifest.json.\n')
          PY
          if [[ "$BETA" == true ]]; then mode=(--prerelease --latest=false); else mode=(--draft); fi
          gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --title "WLSAPlus $VERSION" --notes-file release-notes.txt "${mode[@]}"
      - name: Advance the existing beta update channel
        if: needs.build.outputs.beta == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view channel-beta >/dev/null 2>&1; then
            gh release create channel-beta --prerelease --latest=false --title 'Beta update channel' --notes 'Signed update manifest for opted-in test builds.'
          fi
          gh release upload channel-beta artifacts/update-manifest.json --clobber
